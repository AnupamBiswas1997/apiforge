# =============================================================================
# docker-compose.yml — APIForge development + production compose config
# =============================================================================
# Usage:
#   Development (with hot reload):  docker-compose up
#   Production (pre-built image):   docker-compose --profile prod up
#
# Before running, copy .env.example to .env and fill in your LLM credentials.
# =============================================================================

version: '3.9'

services:
  # ── Production service (single container, pre-built) ──────────────────────
  apiforge:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: apiforge
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      # Mount the data directory so runs persist between container restarts
      - apiforge_data:/app/data/runs
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      # DATA_DIR inside container — must match the volume mount above
      - DATA_DIR=/app/data/runs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/llm/active"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Development backend (with live reload via nodemon) ────────────────────
  apiforge-server-dev:
    image: node:20-alpine
    container_name: apiforge-server-dev
    working_dir: /app
    volumes:
      - .:/app
      - server_node_modules:/app/server/node_modules
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATA_DIR=/app/data/runs
    command: sh -c "cd server && npm install && npx nodemon index.js"
    profiles:
      - dev

  # ── Development frontend (Vite dev server) ────────────────────────────────
  apiforge-client-dev:
    image: node:20-alpine
    container_name: apiforge-client-dev
    working_dir: /app/client
    volumes:
      - .:/app
      - client_node_modules:/app/client/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - apiforge-server-dev
    profiles:
      - dev

volumes:
  apiforge_data:
    driver: local
  server_node_modules:
    driver: local
  client_node_modules:
    driver: local
